<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>iPhone Safari 攝影機測試</title>
<style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#10251c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}h1{font-size:23px}p{line-height:1.6}.panel{background:#fff;color:#183b2b;border-radius:16px;padding:16px;margin:14px 0}button{border:0;border-radius:999px;padding:14px 18px;background:#19734b;color:white;font-size:16px;font-weight:700;margin:4px}video{display:block;width:100%;min-height:220px;max-height:60vh;background:#111;border-radius:12px;object-fit:cover;margin-top:14px}#status{font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><h1>📷 iPhone Safari 攝影機測試</h1><p>使用 Safari 開啟本頁，按下啟動按鈕。本頁不使用 AR.js。</p><div class="panel"><button id="start" type="button">啟動後鏡頭</button><button id="front" type="button" style="background:#526b5c">切換前鏡頭</button><p id="status">JavaScript 已成功載入。尚未啟動。</p><video id="preview" autoplay muted playsinline webkit-playsinline></video></div>
<script>
(function(){const v=document.getElementById('preview'),s=document.getElementById('status');let stream=null,facing='environment';function say(t){s.textContent=t}
async function start(){say('按鈕已觸發，正在檢查攝影機…');try{if(!window.isSecureContext)throw Error('目前不是 HTTPS 安全連線');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('Safari 未提供 getUserMedia');if(stream)stream.getTracks().forEach(t=>t.stop());say('正在要求攝影機權限…');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing}}});v.srcObject=stream;v.muted=true;v.playsInline=true;await v.play();say('攝影機啟動成功：'+(stream.getVideoTracks()[0].label||'已連線'))}catch(e){say('啟動失敗：'+(e.name||'Error')+'\n'+(e.message||String(e))) }}
document.getElementById('start').addEventListener('click',start);document.getElementById('front').addEventListener('click',()=>{facing=facing==='environment'?'user':'environment';start()});})();
</script></body></html>
